<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackatime Stats</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="left">
            <a href="index.html">Ketan Gupta</a>
        </div>
        <div class="right">
            <div class="links">
                <a href="projects.html">projects</a>
                <a href="stats.html">stats</a>
                |
            </div>
            <div id="time"></div>
            <div class="place">Kolkata,IN</div>
        </div>
    </nav>

    <div class="stats">
        <div class="hackatime">
            <h2>Hackatime Stats</h2>

            <div class="time_card">
                <div class="label">Coding Time</div>
                <div class="total" id="totaltime"></div>
            </div>

            <div class="lang_card">
                <h3>Top 6 Languages</h3>
                <div id="languages"></div>
            </div>
            <div class="activity">
                <img src="https://heatmap.shymike.dev/?id=11497&timezone=Asia/Kolkata" alt="">
            </div>
        </div>
        <div class="github">
            <h2>Github Stats</h2>
            <div class="skills">
                <h3>Frontend Technologies</h3>
                <img src="https://skillicons.dev/icons?i=html,css,tailwind" alt="">

                <h3>Database & Tools</h3> 
                <img src="https://skillicons.dev/icons?i=mongodb" alt="">

                <h3>DevOps & Cloud</h3> 
                <img src="https://skillicons.dev/icons?i=git,github,vercel" alt="">

                <h3>Other tools & Technologies</h3> 
                <img src="https://skillicons.dev/icons?i=markdown,vscode,windows,vite,figma,codepen" alt="">

            </div>
            <div class="contribute">
                <img src="https://raw.githubusercontent.com/itsketangupta/itsketangupta/output/github-contribution-grid-snake-dark.svg" alt="">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
